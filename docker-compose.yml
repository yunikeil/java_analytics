services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: analytics_trainer
      POSTGRES_USER: trainer
      POSTGRES_PASSWORD: trainer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainer -d analytics_trainer"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  redis-seed:
    image: redis:7-alpine
    command:
      - sh
      - -c
      - |
        redis-cli -h redis SET analytics_trainer:redis_usage "OTP registration cache and short-lived auth workflow state"
        redis-cli -h redis HSET analytics_trainer:demo_stats active_otps 0 auth_cache enabled service analytics-trainer-api
        redis-cli -h redis SETEX analytics_trainer:sample_otp 600 "masked-demo-otp"
    depends_on:
      - redis

  redis-insight:
    image: redis/redisinsight:latest
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: 6379
      RI_REDIS_ALIAS: analytics-trainer-redis
      RI_REDIS_DB: 0
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"
    ports:
      - "5540:5540"
    volumes:
      - redis_insight_data:/data
    depends_on:
      - redis
      - redis-seed

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      APP_PORT: 8080
      JDBC_URL: jdbc:postgresql://postgres:5432/analytics_trainer
      JDBC_USER: trainer
      JDBC_PASSWORD: trainer
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: dev-secret-change-me
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      MAIL_FROM: trainer@local.dev
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: analytics-trainer-api
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - maven_cache:/root/.m2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mailhog:
        condition: service_started
      otel-collector:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend
      - cadvisor
      - redis-exporter
      - postgres-exporter

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    ports:
      - "8083:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg

  redis-exporter:
    image: oliver006/redis_exporter:v1.63.0
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      - redis

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgresql://trainer:trainer@postgres:5432/analytics_trainer?sslmode=disable
    ports:
      - "9187:9187"
    volumes:
      - ./infra/postgres-exporter/postgres_exporter.yml:/postgres_exporter.yml:ro
    depends_on:
      postgres:
        condition: service_healthy

  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile.dev
    environment:
      SANDBOX_DATABASE_URL: postgresql://analytics_sandbox:sandbox@postgres:5432/analytics_sandbox
    ports:
      - "8090:8090"
    volumes:
      - ./sandbox:/app
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_URL: http://localhost:8080
      VITE_SANDBOX_URL: http://localhost:8090
    ports:
      - "5173:5173"
    volumes:
      - ./ui:/app
      - ui_node_modules:/app/node_modules
    depends_on:
      - backend
      - sandbox

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    environment:
      SWAGGER_JSON_URL: http://localhost:8080/openapi.yaml
    ports:
      - "8081:8080"
    depends_on:
      - backend

  pgadmin:
    image: dpage/pgadmin4:8.12
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

  loki:
    image: grafana/loki:3.1.1
    command: ["-config.file=/etc/loki/config.yml"]
    ports:
      - "3100:3100"
    volumes:
      - ./infra/loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki

  tempo:
    image: grafana/tempo:2.5.0
    user: "0:0"
    command: ["-config.file=/etc/tempo/config.yml"]
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./infra/tempo/config.yml:/etc/tempo/config.yml:ro
      - tempo_data:/tmp/tempo

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.106.1
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./infra/otel/collector.yml:/etc/otel-collector-config.yml:ro
    depends_on:
      - tempo

  promtail:
    image: grafana/promtail:3.1.1
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./infra/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.1.3
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
      - tempo
      - prometheus

volumes:
  postgres_data:
  redis_data:
  redis_insight_data:
  pgadmin_data:
  grafana_data:
  prometheus_data:
  loki_data:
  tempo_data:
  maven_cache:
  ui_node_modules:
